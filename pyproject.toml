[project]
name = "speech-qa"
version = "0.1.0"
description = "Proof-of-concept question answering over a speech archive (RAG with Ollama and Qdrant)."
requires-python = ">=3.12"
dependencies = [
    "openai>=3.49,<4",
    "pydantic>=2.14,<3",
    "qdrant-client>=1.20,<2",
]

[dependency-groups]
dev = [
    "mypy>=2.4",
    "pip-audit>=2.10",
    "pytest>=9.2",
    "pytest-cov>=7.1",
    "ruff>=0.17",
]

[tool.uv]
# The project is run as `python cli.py ...` from the repository root and is not
# installed as a distribution package; uv only manages its dependencies.
package = false

# --------------------------------------------------------------------------- #
# Ruff: linting (incl. security rules "S") and formatting
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 100
target-version = "py312"
# Ruff handles our Python sources only: Markdown documents (including the
# client's ASSIGNMENT.md) and extra virtual environments used to test other
# Python versions (.venv-py313, ...) are never linted or reformatted.
extend-exclude = ["*.md", ".venv-*"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "D",        # pydocstyle
    "UP",       # pyupgrade
    "B",        # flake8-bugbear
    "S",        # flake8-bandit (security)
    "C4",       # flake8-comprehensions
    "SIM",      # flake8-simplify
    "RET",      # flake8-return
    "PTH",      # flake8-use-pathlib
    "PT",       # flake8-pytest-style
    "RUF",      # ruff-specific rules
]
ignore = [
    "D105",     # magic methods are self-explanatory
    "D107",     # __init__ is documented in the class docstring
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "D",        # test names describe the behaviour
    "S101",     # assert is the point of a test
]
"speech_qa/messages.py" = [
    "RUF001",   # Czech user texts use typographic characters (en dash, „quotes“) on purpose
    "RUF002",
]
"speech_qa/evaluation/report.py" = [
    "RUF001",   # the Czech evaluation report, same reason as messages.py
]
"tests/unit/test_eval_runner_and_report.py" = [
    "D",
    "S101",
    "RUF001",   # expected Czech report output
]
"tests/unit/test_messages.py" = [
    "D",
    "S101",
    "RUF001",   # expected Czech output contains the same typographic characters
]

# --------------------------------------------------------------------------- #
# Mypy: strict static typing
# --------------------------------------------------------------------------- #
[tool.mypy]
python_version = "3.12"
strict = true
files = ["cli.py", "speech_qa", "tests"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# --------------------------------------------------------------------------- #
# Pytest + coverage
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    "-m", "not integration",
    "--cov=speech_qa",
    "--cov-report=term-missing",
    "--cov-fail-under=85",
]
markers = [
    "integration: needs a running Ollama with the configured models (run with: pytest -m integration)",
]
filterwarnings = [
    # Bug in qdrant-client (local mode): it opens a temporary in-memory SQLite
    # connection with `with sqlite3.connect(...)`, which never closes it, and
    # Python 3.13+ reports that. Our code always closes the Qdrant client.
    "ignore:unclosed database in <sqlite3.Connection:ResourceWarning",
]

[tool.coverage.run]
branch = true
source = ["speech_qa"]

[tool.coverage.report]
exclude_also = [
    "@abstractmethod",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
